name = omni_translate
summary = "OmniTranslate - Smart Bidirectional Real-time Translation"
description = """A robust translation add-on for NVDA featuring smart bidirectional translation, dual-engine failover, support for 100+ languages, customizable target slots, speech toggle, and accessible result viewer/history dialogs.
Key Shortcuts:
- NVDA+Shift+T: Translate selected text or clipboard content
- NVDA+Shift+S: Swap secondary and target languages
- NVDA+Shift+J: Cycle through configured target language slots
- NVDA+Shift+Z: Repeat last translated result
- NVDA+Shift+V: Open Result Viewer dialog
- NVDA+Shift+H: Open Translation History
- NVDA+Shift+C: Copy last result to clipboard
- NVDA+Shift+M: Toggle automatic speech output
- NVDA+Shift+O: Open OmniTranslate Settings"""
author = "Isara <isara.rak1994@gmail.com>"
version = 2026.2.1
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
