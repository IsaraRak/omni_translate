name = omni_translate
summary = "OmniTranslate"
description = """OmniTranslate - High-speed, comprehensive translation addon supporting 100+ languages including Korean, Japanese, and Chinese with 5 customizable quick-switch slots.
 Shortcuts:
 - NVDA+Shift+T: Translate selected text or clipboard content.
 - NVDA+Shift+S: Swap source and target languages.
 - NVDA+Shift+L: Quick-cycle target language among configured slots.
 - NVDA+Shift+V: Open Result Viewer dialog.
 - NVDA+Shift+H: Open Translation History dialog.
 - NVDA+Shift+M: Toggle speech output (ON / Silent Mode).
 - NVDA+Shift+A: Announce last translated text.
 - NVDA+Shift+C: Copy last translated text to clipboard.
 - NVDA+Shift+O: Open OmniTranslate Settings dialog."""
author = "Isara <isara.rak1994@gmail.com>"
version = 2026.2
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
url = "https://github.com/IsaraRak/omni_translate"
