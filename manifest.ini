name = omni_translate
summary = "OmniTranslate"
description = """A powerful, modern translation add-on for NVDA with local AI offline translation, smart bidirectional routing, dual-engine online failover, 100+ languages support, 10 quick-switch slots, and conflict-free layered shortcuts.

Key shortcuts (Layered 2-Step):
- Press NVDA+Shift+T, then press:
  * 1 - 0: Select Quick Slot 1 to 10 and translate instantly (0 = Slot 10)
  * Shift+1 - Shift+0: Switch source language to Quick Slot 1 to 10 (without translating)
  * T: Translate selected text or clipboard
  * S: Toggle translation mode (Online / Offline)
  * V: Open Result Viewer dialog
  * H: Open Translation History dialog
  * M: Toggle speech output
  * R: Repeat last translation
  * C: Copy last translation to clipboard
  * O: Open OmniTranslate Settings
  * F1: Open User Documentation
  * Escape: Cancel layer"""
author = "Isara Watthanawirojkul <isara.rak@gmail.com>"
